[package]
name = "python-binance-rs"
version = "0.1.0"
edition = "2024"
description = "A python-binance-inspired async Rust client for Binance Spot REST APIs"
license = "MIT"
repository = "https://github.com/aznikline/rust-binance"

[dependencies]
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
httpmock = "0.7"
